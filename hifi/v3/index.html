<!doctype html>
<html lang="en">
<head>
<!-- Bolto hi-fi v3: v2 copied, with an agent chat that replaces the form column. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New offer · Bolto</title>
<!-- Bolto offer flow, v2: the offer can start from a job link, notes, a file or an approved offer. Built on the v1 page.
     Shared kit: shared/. -->
<link rel="icon" href="shared/brand/brandmark-ink.svg">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/hifi.css">
<link rel="stylesheet" href="agent.css">
<style>
/* Page-level overrides (tokens only). The floor bar's fill is a measurement, not an action, so it's neutral, not Bolto Blue. */
.floor-fill { background: var(--ink-2); }
.result.neutral .ic { color: var(--ink-2); }
/* Narrow-phone fit (320px). An input's default size set the affix's min-content, and a grid item's min-width:auto let it push
   the accordion past the screen; floor labels are nudged back inside the track by clampFloorLabs(). */
.acc-clip, .acc-inner { min-width: 0; }
.affix input { width: 0; }
.floor-lab { translate: var(--nudge, 0) 0; }
/* The email preview's button is a picture of what the hire sees, not a control: muted, so Send stays the one primary on Review. */
.fakebtn { min-height: 28px; padding: 0 var(--s3); background: var(--surface-sunk); color: var(--ink-2); border: 1px solid var(--line-2); font: var(--p4); }
/* v2 page parts on the shared kit (tokens only) */
.start-h { font: var(--h6); color: var(--ink); margin: 0 0 var(--s4); }
.combo { position: relative; }
.combo .search-ic { position: absolute; left: var(--s3); top: 50%; transform: translateY(-50%); color: var(--ink-2); pointer-events: none; }
.combo .input { padding-left: calc(var(--s3) + var(--icon) + var(--s2)); }
.cand-list { position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + var(--s1)); margin: 0; padding: var(--s1); list-style: none; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-md); box-shadow: var(--shadow-pop);
  opacity: 0; transform: translateY(var(--rise-sm)); transition: opacity var(--d-fast) var(--ease-enter), transform var(--d-fast) var(--ease-enter); }
.cand-list.is-open { opacity: 1; transform: none; }
.cand-opt { display: flex; align-items: center; gap: var(--s3); padding: var(--s2) var(--s3); border-radius: var(--r-sm); cursor: pointer; min-height: 44px; }
.cand-opt[aria-selected="true"] { background: var(--surface-tint); }
@media (hover: hover) and (pointer: fine) { .cand-opt:not([aria-disabled="true"]):hover { background: var(--surface-tint); } }
.cand-opt[aria-disabled="true"] { cursor: default; color: var(--ink-2); font: var(--p3); }
.cand-opt .avatar { position: static; transform: none; flex: none; }
.cand-txt { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.cand-txt .n { font: var(--label); color: var(--ink); }
.cand-txt .r { font: var(--p3); color: var(--ink-2); }
.or-row { display: flex; align-items: center; gap: var(--s3); margin: var(--s6) 0 0; font: var(--p3); color: var(--ink-2); }
.or-row::before, .or-row::after { content: ""; flex: 1; border-top: 1px solid var(--line-1); }
.drop { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; margin-top: var(--s2); padding: var(--s3); border: 1px dashed var(--line-field); border-radius: var(--r-md); font: var(--p3); color: var(--ink-2); }
.drop.is-over { border-color: var(--blue); background: var(--surface-tint); }
.start-acts { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; margin-top: var(--s4); }
.fill-row { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; margin-top: var(--s4); }
.fill-row[hidden] { display: none; }
.start-card .fill-row { padding: 0 var(--s6) var(--s6); margin-top: 0; }
.start-card .fill-row.sr { padding: 0; }
.pastemsg { font: var(--p3); color: var(--error); margin-top: var(--s2); }
.pastemsg:empty { display: none; }
.src-slot { display: flex; align-items: center; flex-wrap: wrap; gap: var(--s1) var(--s3); margin-top: var(--s2); }
.src-slot .src { font: var(--p3); color: var(--ink-2); margin: 0; }
.src-slot .src:empty { display: none; }
.conflict-wrap { border: 0; padding: 0; margin: 0; min-width: 0; }
.conflict-wrap > legend { font: var(--label); color: var(--ink); margin-bottom: var(--s2); padding: 0; }
.conflict-card { display: flex; flex-direction: column; gap: var(--s2); }
.conflict-card .who { display: flex; align-items: center; gap: var(--s1); font: var(--p4); color: var(--ink-2); margin: 0; }
.conflict-card .who .ic { width: 14px; height: 14px; }
.conflict-card .val { font: var(--h6); color: var(--ink); font-variant-numeric: tabular-nums; margin: 0; }
.conflict-card .q { font: var(--p3); color: var(--ink-2); margin: 0; }
.conflict-card .btn { align-self: flex-start; }
.conflict-card .chosen-ic { display: inline-flex; color: var(--blue); opacity: 0; transform: scale(.6); transition: opacity var(--d-base) var(--ease-enter), transform var(--d-base) var(--ease-enter); }
.conflict-card.is-chosen .chosen-ic { opacity: 1; transform: none; }
.conflict-card.is-gone { opacity: 0; transition: opacity var(--d-base) var(--ease-exit); }
/* the Start card's full view and its folded bar crossfade (content out first, the bar in after the rows start) */
.start-in { transition: opacity var(--d-base) var(--ease-enter) var(--d-delay); }
.start-card[data-open="false"] .start-in { opacity: 0; transition: opacity var(--d-fade-out) var(--ease-exit); }
.start-bar { transition: opacity var(--d-base) var(--ease-enter) var(--d-delay); }
.start-bar.is-pre { opacity: 0; transition: none; }
.checks { margin-top: var(--s6); }
.checks ul { margin: var(--s2) 0 0; padding-left: var(--s4); }
.checks li + li { margin-top: var(--s1); }
.evidence { margin: 0 0 var(--s4); padding: var(--s3) var(--s4); border: 1px solid var(--line-1); border-radius: var(--r-md); background: var(--canvas); }
.evidence .from { display: flex; align-items: center; gap: var(--s1); font: var(--p4); color: var(--ink-2); margin: 0; }
.evidence blockquote { margin: var(--s1) 0 0; font: var(--p3); color: var(--ink); }
.evidence .hint { margin-top: var(--s1); }
.type-says { font: var(--p3); color: var(--ink-2); margin-top: var(--s3); }
.nil .why { display: block; font: var(--p4); color: var(--ink-2); margin-top: var(--s1); }
/* M20/M21: only the value layer moves (the typed text), never the field box; fields the fill does not touch never animate */
.field :is(.input, .select, .textarea, .affix input) { transition: color var(--d-fast) var(--ease-enter), -webkit-text-fill-color var(--d-fast) var(--ease-enter), border-color var(--d-micro) var(--ease-enter); }
:is(.fill-wait, .fill-out) :is(.input, .select, .textarea, .affix input) { color: transparent; -webkit-text-fill-color: transparent; }
.fill-wait :is(.input, .select, .textarea, .affix input) { transition: border-color var(--d-micro) var(--ease-enter); } /* hide at once, fade in on release */
@media (prefers-reduced-motion: reduce) {
  .cand-list { transition: none; transform: none; } .conflict-card, .conflict-card .chosen-ic, .start-in, .start-bar { transition: none; }
  .field :is(.input, .select, .textarea, .affix input) { transition: border-color var(--d-micro) var(--ease-enter); }
  :is(.fill-wait, .fill-out) :is(.input, .select, .textarea, .affix input) { color: var(--ink); -webkit-text-fill-color: currentColor; }
}
/* a conflict reads as one: warning icon + label-weight heading, a "Pick one" tag on the label and the rail row,
   equal-height cards with both "Use this" buttons on one baseline */
.conf-h { display: flex; align-items: flex-start; gap: var(--s2); margin: 0 0 var(--s3); font: var(--label); color: var(--ink); }
.conf-h .ic { flex: none; color: var(--warning); }
.conf-tag { margin-left: var(--s2); vertical-align: middle; }
.conflict-card .btn { margin-top: auto; }
[data-flag="conflict"] .meta, .acc-left[data-flag="conflict"] { background: var(--warning-bg); color: var(--ink); border-radius: var(--r-pill); padding: 0 var(--s2); }
/* the approval sentence sits in the footer, right beside (desktop) or right above (phone) Send */
.approve-ft { flex: 1; min-width: 0; margin: 0; font: var(--p3); color: var(--ink); text-align: right; }
.hx-footer:has(.approve-ft) { height: auto; min-height: 72px; }
.hx-footer:has(.approve-ft) .hx-footer-in { min-height: 72px; padding-top: var(--s3); padding-bottom: var(--s3); }
body:has(.approve-ft) .rv { padding-bottom: calc(var(--ft-h, 72px) + var(--s6)); }
@media (max-width: 768px) {
  .hx-footer:has(.approve-ft) .hx-footer-in { flex-wrap: wrap; row-gap: var(--s2); }
  .approve-ft { flex: 1 0 100%; order: -1; text-align: left; font: var(--p4); }
  .approve-ft ~ .btn-send { margin-left: auto; }
}
/* Hifi.focusQuiet: a programmatic focus after a touch tap draws no keyboard ring (r12 B8) */
[data-quiet-focus]:focus-visible, .acc-btn[data-quiet-focus]:focus-visible::after { outline: none; }
.affix:has(input[data-quiet-focus]), .seg-opt:has(input[data-quiet-focus]), .ropt:has(input[data-quiet-focus]), .chk:has(input[data-quiet-focus]) .box, .rcard input[data-quiet-focus] + .rcard-box { outline: none; }
</style>
</head>

<script>
'use strict';
const {$, $$, esc, Motion, say, Ring, Accordion, Checklist, Toggletip, Segmented, busy, Demo, Fill, StatusLine, SaveMark} = Hifi;
const I = (n, c) => Icons.svg(n, c);

/* ===================== dummy data (brief p2), ported from the lo-fi ===================== */
const TODAY = new Date(2026, 4, 25);            // prototype "today": Monday May 25, 2026
const COMPANY = 'Acme Co.';
const PEOPLE = ['Jordan Lee', 'Sam Patel'];
const SENDERS = [{id:'sam', name:'Sam Patel', title:'Head of People', email:'sam.patel@example.com'}];
const OFFICES = [{id:'ny', name:'New York office', state:'NY-NYC'}];
const STATES = [['AL','Alabama'],['AK','Alaska'],['AZ','Arizona'],['AR','Arkansas'],['CA','California'],['CO','Colorado'],['CT','Connecticut'],['DE','Delaware'],['DC','District of Columbia'],['FL','Florida'],['GA','Georgia'],['HI','Hawaii'],['ID','Idaho'],['IL','Illinois'],['IN','Indiana'],['IA','Iowa'],['KS','Kansas'],['KY','Kentucky'],['LA','Louisiana'],['ME','Maine'],['MD','Maryland'],['MA','Massachusetts'],['MI','Michigan'],['MN','Minnesota'],['MS','Mississippi'],['MO','Missouri'],['MT','Montana'],['NE','Nebraska'],['NV','Nevada'],['NH','New Hampshire'],['NJ','New Jersey'],['NM','New Mexico'],['NY-NYC','New York City area (NYC, Nassau, Suffolk, Westchester)'],['NY-REST','New York (rest of state)'],['NC','North Carolina'],['ND','North Dakota'],['OH','Ohio'],['OK','Oklahoma'],['OR','Oregon'],['PA','Pennsylvania'],['RI','Rhode Island'],['SC','South Carolina'],['SD','South Dakota'],['TN','Tennessee'],['TX','Texas'],['UT','Utah'],['VT','Vermont'],['VA','Virginia'],['WA','Washington'],['WV','West Virginia'],['WI','Wisconsin'],['WY','Wyoming']];
const PLACE = {'NY-NYC':'the New York City area', 'NY-REST':'New York outside the NYC area'};
/* Overtime floors, 2026 (lo-fi, unchanged). salary: below it, overtime always applies. hourly: computer-job hourly floor.
   comp: salary needed for the software option. mgr: salary needed for the manager and office-work options. */
const FED = {salary:35568, hourly:27.63, comp:35568, mgr:35568};
const FLOORS = {
  'CA': {salary:70304, hourly:58.85, comp:122573.13, mgr:70304},
  'WA': {salary:80168.40, hourly:59.96, comp:80168.40, mgr:80168.40},
  'NY-NYC': {...FED, mgr:66300, mgrWeek:1275.00, fedKeys:['salary', 'hourly', 'comp']},
  'NY-REST': {...FED, mgr:62353.20, mgrWeek:1199.10, fedKeys:['salary', 'hourly', 'comp']}
};
const DUTIES = {
  software:'Works as a software engineer, programmer or systems analyst',
  manage:'Manages the business or a department, directs 2 or more full-time people, and can hire and fire or has a real say in it',
  admin:'Office work on running the business, where they make independent decisions on important matters',
  study:'Work that needs advanced study, like law, medicine or accounting',
  none:'None of these',
  unsure:"I'm not sure"
};
/* Info-tip texts: spec 17 §5, word for word */
const TIP = {
  type:"W-2: an employee on your payroll. You withhold their taxes. 1099: an independent contractor. You generally don't withhold taxes for them.",
  state:"Where they'll work from. Pay and overtime rules can depend on the state. It isn't shown in the letter.",
  repay:'They pay the bonus back only if they resign or are let go for cause within this time.',
  repayC:'They pay the bonus back only if they end this engagement within this time.',
  hire:'Not in the letter. Bolto uses these to set them up in payroll after they sign.',
  pg:'Everyone in a group is paid together, with the same settings. Bolto picks it from the pay type.',
  flsa:'FLSA is the US law on overtime. Most employees get 1.5× their pay rate for hours past 40 in a week. Some jobs are exempt, depending on their pay and duties.',
  i9:'A US form you and every new employee fill in to confirm they can work in the US. Bolto collects it after they sign.',
  invite:'After they sign, Bolto emails them to set up their account and start onboarding.',
  notes:'Bolto read this from your notes. Check it before you use it.'
};

/* ===================== v2 demo data (15-v2-decision-log.md, "Demo data"), ported from lofi-v2. Everything not in the brief is INVENTED ===================== */
const POSTINGS = {
  alex: {title:'Senior full-stack engineer', loc:'Remote', type:'Full-time', unit:'Salary', min:140000, max:170000,       // invented
    lines:['Build features across our web app, front end to back end', 'Design and run the APIs our customers rely on', 'Review code and help set how the team ships'], // invented
    duties:"You'll write, test and ship code across the front end and back end of our product."},                          // invented
  priya: {title:'Product designer', loc:'Hybrid', office:'ny', type:'Contract', unit:'Hourly', min:90, max:100,         // invented
    lines:['Design flows and screens for new product features', 'Run quick tests with customers and share what you learn', 'Work with engineers to ship the designs'], // invented
    duties:"You'll design flows and screens for our product, working closely with engineers."}                            // invented
};
const ASHBY_ALEX = {name:'Alex Rivera', status:'approved',                                                              // approved: invented
  offer:{first:'Alex', last:'Rivera', email:'alex.rivera@example.com', title:'Senior full-stack engineer', startDate:'2026-06-15', amount:'150,000'},
  custom:{bonus:'10,000', bonusRepay:true, bonusMonths:'12'},                                                            // custom fields: invented
  team:{reportsTo:'Jordan Lee'}};
const ALEX_EMAIL = "Let's have Alex start June 22";                                                                      // invented
const PRIYA_LINK = 'https://jobs.ashbyhq.com/acme/product-designer';                                                     // invented
const PRIYA_NOTES = 'Priya Shah, contractor through Dec 31. $95/hr. Starts Jul 1. Hybrid in the NY office. Jordan is her contact and will set her weekly schedule.'; // invented
/* name = the section badge (17 §5: "Ashby", "Posting", "Your notes"; no third-party logos) */
const SRC = {
  offer:   {line:() => `From ${S.cand || 'the candidate'}'s offer in ${ATS()}, approved`, get short(){ return `From the ${ATS()} offer`; }, get name(){ return ATS(); }, get badge(){ return ATS(); }, icon:'users', get use(){ return `Use ${ATS()}'s value`; }},
  cand:    {line:() => `From ${S.cand || 'the candidate'}'s record in ${ATS()}`, get short(){ return `From the record in ${ATS()}`; }, get name(){ return ATS(); }, get badge(){ return ATS(); }, icon:'users', get use(){ return `Use ${ATS()}'s value`; }},
  team:    {line:() => `From the hiring team in ${ATS()}`, get short(){ return `From the hiring team in ${ATS()}`; }, get name(){ return ATS(); }, get badge(){ return ATS(); }, icon:'users', get use(){ return `Use ${ATS()}'s value`; }},
  posting: {line:() => 'From the job posting', short:'From the job posting', name:'The posting', badge:'Posting', icon:'file-text', use:"Use the posting's value"},
  settings:{line:() => 'From company settings', short:'From company settings', name:'Company settings', badge:'Company settings', icon:'building-2', use:'Use the company setting'},
  notes:   {line:() => 'Read from your notes', short:'Read from your notes', name:'Your notes', badge:'Your notes', icon:'sticky-note', use:"Use the notes' value"},
  email:   {line:() => "Read from Jordan's email", short:"Read from Jordan's email", name:"Jordan's email", badge:"Jordan's email", icon:'mail', use:"Use the email's value"}
};
/* the lo-fi's source groups (which fields a section's one label speaks for) */
const SRCSEC = {cand:['first', 'last', 'email'], role:['title', 'work', 'startDate', 'endDate', 'reportsTo', 'location', 'state', 'workplace', 'department'],
  pay:['payType', 'amount', 'bonus', 'bonusRepay', 'bonusMonths', 'equity'], terms:['expiry', 'sender']};
const DSHORT = {software:'software engineer', manage:'manages the business or a department', admin:'office work on running the business', study:'work that needs advanced study', none:'none of these'};

/* ===================== state ===================== */
function plusDays(d, n){ const x = new Date(d); x.setDate(x.getDate() + n); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`; }
const ATS = () => WF.boltoJobs ? 'Bolto Recruiting' : 'Ashby';
const WF = {boltoJobs:false, saveFail:false, sendFail:false, ashbyDown:false, fileBad:false, noMatch:false, atsOff:false};
function blankF(){
  return {empType:'', first:'', last:'', email:'', title:'', work:'', startDate:'', endDate:'', reportsTo:'', location:'', state:'', workplace:'', department:'',
    payType:'', amount:'', bonusOpen:false, bonus:'', bonusRepay:false, bonusMonths:'', equityOpen:false, equity:'',
    payrollGroup:'', duties:'', invite:true, expiry:plusDays(TODAY, 7), sender:'sam', note:''};
}
let S;
function fresh(){
  S = {mode:(S && S.mode) || 'agent', ag:null, screen:'offer', f:blankF(), style:'Standard', pgOverride:false, otBasis:'', otMode:'', blurErr:new Set(), draft:false, save:'', savedAt:'', newOffer:true,
       errItems:null, lastN:null, otSaid:null, sent:false, sendErr:false, hireHTML:'', saveT:null, lastField:null, view:'edit', fresh:new Map(),
       /* v2: where each value came from, read values waiting on a click, two-source conflicts, the fill status line */
       src:{}, prop:{}, conf:{}, typed:{}, ckSaid:null, pasteMsg:'', posting:null, notes:'', notesType:'', cand:'', q:'', paste:'',
       fill:{text:'', pre:null, undo:false, retry:null, busy:false}, fillT:null, filled:false, fillOpened:false, filling:false, active:-1, bar:false, barFrom:'', startOpen:false};
}
fresh();

/* ===================== helpers (lo-fi) ===================== */
const num = v => { const s = String(v ?? '').replace(/[$,\s]/g, ''); if(!/^\d+(\.\d+)?$/.test(s)) return null; return parseFloat(s); };
const money = n => '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits: Number.isInteger(n) ? 0 : 2, maximumFractionDigits: 2});
const money0 = n => '$' + Math.round(Number(n)).toLocaleString('en-US');
const iso2d = iso => { const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); };
const fdate = iso => iso ? iso2d(iso).toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'}) : '';
const sdate = iso => iso ? iso2d(iso).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}) : '';
const md = d => d.toLocaleDateString('en-US', {month:'short', day:'numeric'});
const isEmp = () => S.f.empType === 'ft' || S.f.empType === 'pt';
const isCon = () => S.f.empType === 'c';
const who = () => S.f.first.trim();
const poss = () => who() ? who() + "'s " : 'their ';
const fullName = () => (S.f.first + ' ' + S.f.last).trim();
const validAmount = () => (num(S.f.amount) || 0) > 0;
const validBonus = () => (num(S.f.bonus) || 0) > 0;
const validMonths = () => /^\d{1,3}$/.test(S.f.bonusMonths.trim()) && +S.f.bonusMonths > 0;
const nonPos = v => { const s = String(v ?? '').replace(/[$,\s]/g, ''); return /^-?\d+(\.\d+)?$/.test(s) && parseFloat(s) <= 0; };
const validEmail = () => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.f.email.trim());
const sender = () => SENDERS.find(s => s.id === S.f.sender) || SENDERS[0];
const office = () => OFFICES.find(o => o.id === S.f.workplace);
const stateName = code => (STATES.find(s => s[0] === code) || [,''])[1];
const place = code => PLACE[code] || stateName(code);
const initials = n => n.split(/\s+/).filter(Boolean).map(w => w[0]).join('').slice(0, 2).toUpperCase();
const EMP = {ft:['Full-time', 'W-2'], pt:['Part-time', 'W-2'], c:['Contractor', '1099']};
const empLabel = () => EMP[S.f.empType] ? EMP[S.f.empType].join(' / ') : '';

/* ===================== overtime (FLSA), lo-fi unchanged ===================== */
function workState(){ return S.f.location === 'Remote' ? S.f.state : ((office() || {}).state || ''); }
function otNeeds(){
  const n = [];
  if(!S.f.location) n.push('location');
  else if(S.f.location === 'Remote'){ if(!S.f.state) n.push('state'); }
  else if(!S.f.workplace) n.push('workplace');
  if(!S.f.payType) n.push('payType');
  if(!validAmount()) n.push('amount');
  return n;
}
function ot(){
  if(!isEmp()) return {mode:'na'};
  const need = otNeeds();
  if(need.length) return {mode:'wait', first:need[0]};
  const st = workState(), fl = FLOORS[st] || FED, amt = num(S.f.amount), wh = place(st);
  const rule = key => !FLOORS[st] ? ` under the federal rule (${wh}'s own rules aren't checked)`
    : (fl.fedKeys || []).includes(key) ? ` under the federal rule (for ${wh}, only the floor for managing and office work is checked)` : ` in ${wh}`;
  if(S.f.payType === 'Hourly'){
    if(amt < fl.hourly) return {mode:'auto', why:`${money(amt)} an hour is below ${money(fl.hourly)}, the lowest hourly pay for the one hourly exemption Bolto checks, computer jobs${rule('hourly')}.`, short:`${money(amt)} an hour is below ${money(fl.hourly)}, the lowest hourly pay for the one exemption Bolto checks.`};
    return {mode:'hourly', hint:`Bolto checks one hourly exemption, for computer jobs, at ${money(fl.hourly)} an hour or more${rule('hourly')}.`};
  }
  if(amt < fl.salary) return {mode:'auto', why:`${money(amt)} a year is below ${money(fl.salary)}, the lowest salary for the overtime exemptions Bolto checks${rule('salary')}.`};
  const opts = [], cut = [];
  if(amt >= fl.comp) opts.push('software'); else cut.push(`Software work skips overtime${rule('comp')} only at ${money(fl.comp)} a year or more.`);
  if(amt >= fl.mgr) opts.push('manage', 'admin');
  else cut.push(`Managing and office work skip overtime${rule('mgr')} only at ${fl.mgrWeek ? '$' + fl.mgrWeek.toLocaleString('en-US', {minimumFractionDigits:2}) + ' a week (' + money(fl.mgr) + ' a year)' : money(fl.mgr) + ' a year'} or more.`);
  opts.push('study', 'none', 'unsure');

}
function otFinal(){
  const o = ot();

  const d = S.f.duties;
  if(!d || d === 'unsure') return null;
  if(o.mode === 'hourly') return d === 'software' ? true : (d === 'none' ? false : null);
  if(!o.opts.includes(d)) return null;

}
const otWords = v => v ? 'No overtime pay (exempt)' : 'Gets overtime pay (non-exempt)';

/* ===================== what's missing: the one list behind the rail, the count and the error summary ===================== */
function missing(){
  const out = [], f = S.f, add = (k, msg) => out.push({k, msg});
  if(!f.empType) add('empType', 'Select the worker type');
  if(!f.first.trim()) add('first', 'Enter their first name');
  if(!f.last.trim()) add('last', 'Enter their last name');
  if(!f.email.trim()) add('email', 'Enter their email address');
  else if(!validEmail()) add('email', 'Enter an email address in the correct format, like name@example.com');
  if(!f.title.trim()) add('title', 'Enter the job title');
  if(!f.startDate) add('startDate', 'Enter the start date');
  if(isCon() && !f.endDate) add('endDate', 'Enter the date the contract ends');
  else if(isCon() && f.startDate && f.endDate <= f.startDate) add('endDate', 'The contract must end after it starts');
  if(!f.reportsTo) add('reportsTo', isCon() ? 'Select their point of contact' : 'Select who they report to');
  if(!f.location) add('location', 'Select where they work');
  else if(f.location === 'Remote'){ if(!isCon() && !f.state) add('state', 'Select the state they will work from'); }
  else if(!f.workplace) add('workplace', 'Select the workplace');
  if(!f.payType) add('payType', S.src.amount && S.src.amount.from === 'offer' ? `A year or an hour? ${ATS()}'s offer has no unit` : 'Select salary or hourly');
  if(payPair()){ /* the pay conflict carries amount and unit together */ }
  else if(!f.amount.trim()) add('amount', 'Enter the pay amount');
  else if(nonPos(f.amount)) add('amount', 'Enter a pay amount above 0');
  else if(!validAmount()) add('amount', 'Enter the pay amount as a number, like 150,000');
  if(f.bonusOpen){
    if(!f.bonus.trim()) add('bonus', 'Enter the signing bonus amount');
    else if(nonPos(f.bonus)) add('bonus', 'Enter a bonus amount above 0');
    else if(!validBonus()) add('bonus', 'Enter the signing bonus as a number, like 10,000');
    if(f.bonusRepay && nonPos(f.bonusMonths)) add('bonusMonths', 'Enter a number of months above 0');
    else if(f.bonusRepay && !validMonths()) add('bonusMonths', 'Enter the number of months for repaying the bonus');
  }
  if(f.equityOpen && !f.equity.trim()) add('equity', 'Enter the equity as it should read in the letter');
  /* v2 (lo-fi N5): the overtime question counts once an employee type is chosen, so "N left" holds still as the form fills */
  if(isEmp() && ot().mode !== 'wait' && otFinal() === null) add('duties', `Answer the overtime question${who() ? ' for ' + who() : ''}${f.duties === 'unsure' ? ', or check with whoever runs payroll' : ''}`);
  if(!f.expiry) add('expiry', 'Enter when the offer expires');
  else if(iso2d(f.expiry) < TODAY) add('expiry', "The offer can't expire before today");
  /* v2: a conflict or a value read from notes replaces the plain "enter it" message */
  out.forEach(m => {
    const c = S.conf[m.k], p = S.prop[m.k];
    if(c) m.msg = `Pick the ${c.pair ? 'pay' : (GAPLABEL[m.k] || m.k).toLowerCase()}: ${c.opts[0].label} and ${c.opts[1].label} disagree`;
    else if(p) m.msg = `Check the ${(GAPLABEL[m.k] || m.k).toLowerCase()} your notes give: “${p.quote}”`;
  });
  return out;
}

/* ===================== v2: "Check this", never blocks and never counts (15-v2 log, Needs you vs Check this) ===================== */
function checks(){
  const f = S.f, out = [], pst = S.posting;
  const a = num(f.amount);
  if(pst && a && f.payType === pst.unit && (a < pst.min || a > pst.max))
    out.push({k:'amount', msg:`${money(a)} is outside the posted range, ${money(pst.min)} to ${money(pst.max)} ${pst.unit === 'Hourly' ? 'an hour' : 'a year'}`});
  const m = S.notes.match(/will set (?:her|his|their) weekly schedule/i);
  if(m && !isEmp()) out.push({k:'empType', msg:`Your notes mention “${m[0]}”. Who sets the schedule is one thing the US Department of Labor looks at. No single thing decides it.`});
  if(f.expiry && f.startDate && f.expiry > f.startDate) out.push({k:'expiry', msg:`The offer expires after the start date (${fdate(f.startDate)})`});
  return out;
}
function checksHTML(){

/* ===================== v2: source labels (15-v2 log, Source labels; 17 §5: one badge per section) ===================== */
function fmtV(k, v){
  if(k === 'amount' || k === 'bonus') return money(num(v));
  if(k === 'startDate' || k === 'endDate' || k === 'expiry') return fdate(v);
  if(k === 'workplace') return (OFFICES.find(o => o.id === v) || {}).name || v;
  if(k === 'bonusMonths') return `${v} months`;
  if(k === 'bonusRepay') return v ? 'repaid if they leave early' : 'not repaid';
  if(k === 'payType') return v === 'Hourly' ? 'an hour' : 'a year';
  if(k === 'work') return 'the posting’s list';
  return String(v);
}
const same = (k, a, b) => (k === 'amount' || k === 'bonus') ? num(a) === num(b) : String(a ?? '').trim() === String(b ?? '').trim();
const changed = k => S.src[k] && !same(k, S.f[k], S.src[k].val);
const srcSecOf = k => Object.keys(SRCSEC).find(s => SRCSEC[s].includes(k));
function secSrc(sec){
  if(!sec || !SRCSEC[sec]) return '';
  const n = {};
  /* a section holding a value you typed gets no section badge (it would label your value); its filled fields label themselves */
  if(SRCSEC[sec].some(k => !S.src[k] && !S.conf[k] && S.typed[k] && String(S.f[k] ?? '').trim() !== '')) return '';
  SRCSEC[sec].forEach(k => { const s = S.src[k]; if(s && s.kind === 'copied' && !s.note && k !== 'work') n[s.from] = (n[s.from] || 0) + 1; });
  return Object.keys(n).sort((a, b) => n[b] - n[a])[0] || '';
}
function badgeInner(sec){ const f = secSrc(sec); return f ? `${I(SRC[f].icon)}<span aria-hidden="true">${esc(SRC[f].badge)}</span><span class="sr">${esc(SRC[f].line())}</span>` : ''; }
function badgeHTML(sec){ return SRCSEC[sec] ? `<span class="src-badge" id="sl-${sec}"${secSrc(sec) ? '' : ' hidden'}>${badgeInner(sec)}</span>` : ''; }
function srcParts(k){
  const p = S.prop[k];
  if(p) return {t:`Your notes say “${esc(p.quote)}”. Pay from notes waits for you to confirm it.`, b:`${tip('Read from notes', TIP.notes)}<button type="button" class="linkbtn" data-use="${k}">Use ${esc(p.label)}</button>`};
  const s = S.src[k]; if(!s) return {t:'', b:''};
  if(changed(k)){
    const was = s.from === 'settings' ? `Company setting: ${k === 'expiry' ? '7 days from today' : esc(k === 'sender' ? (SENDERS.find(x => x.id === s.val) || {}).name || s.val : fmtV(k, s.val))}`
      : k === 'payType' ? `${SRC[s.from].name} gives pay ${s.val === 'Hourly' ? 'by the hour' : 'per year'}`
      : `${SRC[s.from].name} had ${esc(fmtV(k, s.val))}`;
    return {t:`You changed this. ${was}`, b:`<button type="button" class="linkbtn" data-revert="${k}">${SRC[s.from].use}</button>`};
  }
  if(k === 'work' && s.from === 'posting') return {t:'Read from the job posting. Edit it.', b:''};
  if(s.kind === 'read') return {t:`${SRC[s.from].short}: “${esc(s.quote)}”`, b:s.from === 'notes' ? tip('Read from notes', TIP.notes) : ''};
  if(s.note) return {t:esc(s.note), b:''};

function srcSlot(k){

function updateSrc(k){ const el = $('#ss-' + k); if(!el) return; const p = srcParts(k); const h = `<p class="src" id="src-${k}">${p.t}</p>${p.b}`; if(el.dataset.html !== h){ el.innerHTML = h; el.dataset.html = h; } }

/* Keep the floor labels inside the bar's width on any screen: a centred or end-aligned label that would cross an edge is nudged back. */
function clampFloorLabs(t){
  const tr = t.getBoundingClientRect(); if(!tr.width) return;
  t.querySelectorAll('.floor-lab').forEach(l => {
    l.style.removeProperty('--nudge'); const r = l.getBoundingClientRect();
    const d = r.width > tr.width || r.left < tr.left ? tr.left - r.left : r.right > tr.right ? tr.right - r.right : 0;
    if(Math.abs(d) > 0.5) l.style.setProperty('--nudge', d.toFixed(1) + 'px');
  });
}
const floorRO = new ResizeObserver(es => es.forEach(e => clampFloorLabs(e.target)));
/* Overtime floor bar (17 §5): the pay against the floor that decides the outcome. Numbers come from the lo-fi's table. */
function floorBar(o){
  const st = workState(), fl = FLOORS[st] || FED, amt = num(S.f.amount), hourly = S.f.payType === 'Hourly';
  const code = st.startsWith('NY') ? 'NY' : st;
  const abbr = key => !FLOORS[st] || (fl.fedKeys || []).includes(key) ? 'Federal' : code;
  let key, F;
  if(hourly){ key = 'hourly'; F = fl.hourly; }
  else if(o.mode === 'auto'){ key = 'salary'; F = fl.salary; }
  else { const c = [['salary', fl.salary], ['comp', fl.comp], ['mgr', fl.mgr]]; const above = c.filter(x => x[1] > amt).sort((a, b) => a[1] - b[1]);
    [key, F] = above.length ? above[0] : c.sort((a, b) => b[1] - a[1])[0]; }
  const max = Math.max(amt, F) * 1.25, fx = amt / max, tx = F / max, u = hourly ? ' / hour' : '';
  const al = p => p > 0.82 ? 'end' : p < 0.18 ? '' : 'mid';
  const mf = hourly ? money : money0, ab = abbr(key), floorT = `Exempt minimum (${ab === 'Federal' ? 'federal' : ab}) ${mf(F)}${u}`;
  const label = `${mf(amt)}${u}. ${floorT}.`;
  return `<div class="floor" role="img" aria-label="${esc(label)}"><div class="floor-track"><span class="floor-fill" style="--f:${fx.toFixed(3)}"></span>
    <span class="floor-tick" style="left:${(tx * 100).toFixed(1)}%"></span>
    <span class="floor-lab top ${al(tx)}" style="left:${(tx * 100).toFixed(1)}%">${floorT}</span>
    <span class="floor-lab bot ${al(fx)}" style="left:${(fx * 100).toFixed(1)}%">${mf(amt)}${u}</span></div></div>`;
}

  const tok = (btn.__fd = (btn.__fd || 0) + 1), ms = Motion.ms('--d-fade-out');

  const slide = from => { if(!sib || !from || !ms) return; const to = sib.getBoundingClientRect(), dx = from.left - to.left, dy = from.top - to.top; if(!dx && !dy) return;
    sib.style.transition = 'none'; sib.style.transform = `translate(${dx}px, ${dy}px)`; void sib.offsetWidth;

      updateConditional(); updateHeader(); updateHire(null); updateLetter(); updateBar(false, true); renderErrors();
      SECTIONS.forEach(s => CHECK.set(s.id, {...secStatus(s.id), animate:false}));
      /* rule 2: a new offer opens with all six open; a draft opens with done sections collapsed */
      const isNew = S.newOffer;

      setSave(S.draft ? (S.save === 'failed' ? 'failed' : 'saved') : '', S.save === 'saved-back' ? S.savedText : undefined);
